# A9 POC. Rotation and black level remain provisional until a scene is captured.
# Default DT includes both sensors; orientation/rotation properties win over YAML.
cameras:
  "/base/soc@0/cci@5c1b000/i2c-bus@0/rear@10":
    location: back
    rotation: 270
    order: 0
  "/base/soc@0/cci@5c1b000/i2c-bus@0/front@20":
    location: front
    rotation: 270
    order: 1
