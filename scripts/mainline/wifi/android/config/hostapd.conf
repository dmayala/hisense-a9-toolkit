# MANUAL AP TEMPLATE ONLY. The AIDL hostapd service uses framework-generated
# configuration; this template is never passed by init or auto-started.
interface=wlan0
driver=nl80211
ctrl_interface=/data/vendor/wifi/hostapd/sockets
ssid=A9-offline-test
hw_mode=g
channel=1
# No country code is invented and no password is committed. An attended AP
# experiment must supply its own reviewed WPA2/WPA3 credentials/config.
