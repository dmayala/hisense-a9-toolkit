# /vendor/etc/thermal-a9.conf -- A9 mainline thermal HAL sensors (runs/sensors.md section 3,
# runs/android-thermal-health.md). 2026-10-16, android-thermal worktree: thresholds aligned with the kernel
# trips of the step-2-proven thermal kernel (0043-0046, a9-thermal.dtsi; checked against the snapshot DTB by
# tests/check-conf-vs-dtb.py). Not yet run on the phone.
# name  type  source[|alternative..]  scale  LIGHT MODERATE SEVERE CRITICAL EMERGENCY SHUTDOWN  [interval_s]
# '-' = unset. Sources: zone:<thermal zone type> | adczone:<zone on an ADC thermistor> | iio:<IIO temp label> | file:<sysfs path>, '@<scale>' per source.
# Severity rises only after 3 consecutive samples at/above a threshold (re-read every 1 s while
# confirming), falls 2 C below it. A reading outside the source's physical range (tsens -40..150 C,
# ADC thermistor strictly inside -40..125 C = the clamped table ends) is a sensor FAULT: value NaN,
# severity NONE, sensor stays listed. The HAL only REPORTS (it never writes trips, emul_temp or any
# cooling state): the kernel does the mitigation (a9-thermal.dtsi cooling-maps: cpufreq at 90/95 C per
# CPU zone, quiet_therm 45/48 C; GPU devfreq at 85 C; critical 110 C = kernel power-off with
# a9-thermal.config). Android acts on SHUTDOWN for CPU, GPU, SKIN and BATTERY sensors
# (ThermalManagerService: clean shutdown), so every SHUTDOWN below sits under the kernel's critical trip.
# Thermal STATUS (apps, headroom) follows SKIN sensors only.
#
# Mapping to the kernel (same pattern as the A6L HAL, thermal-a6l.conf: the Android status follows the
# mitigation stages instead of preceding them):
#   LIGHT    = the zone's first passive trip (kernel starts throttling): CPU 90, GPU 85, skin 45
#   MODERATE = the second passive trip (all kernel stages engaged): CPU 95, skin 48 (silver); GPU 90
#   SEVERE..EMERGENCY = still rising with every stage engaged
#   SHUTDOWN = Android clean shutdown, >= 5 C under the kernel critical trip 110 C (CPU/GPU 105)
#
# CPU: mainline tsens zones (sm6115.dtsi; tsens 6-9 gold cores, 10/11 gold pairs, 12 silver).
cpu4    CPU   zone:cpu4-thermal     0.001  90 95 98 100 103 105  5
cpu5    CPU   zone:cpu5-thermal     0.001  90 95 98 100 103 105  5
cpu6    CPU   zone:cpu6-thermal     0.001  90 95 98 100 103 105  5
cpu7    CPU   zone:cpu7-thermal     0.001  90 95 98 100 103 105  5
cpu45   CPU   zone:cpu45-thermal    0.001  90 95 98 100 103 105  5
cpu67   CPU   zone:cpu67-thermal    0.001  90 95 98 100 103 105  5
cpu0123 CPU   zone:cpu0123-thermal  0.001  90 95 98 100 103 105  5
# GPU: tsens 15, kernel passive 85 C (gpu devfreq cooling, only with a --gpu image), critical 110 C
gpu     GPU   zone:gpu-thermal      0.001  85 90 95 100 103 105  5
# informational tsens zones (stock *-usr names), all MEASURED present on the step1b kernel (2026-10-16)
mapss   SOC   zone:mapss-thermal    0.001  -  -  -  -  -  -  10
cdsp-hvx NPU  zone:cdsp-hvx-thermal 0.001  -  -  -  -  -  -  10
camera  CAMERA zone:camera-thermal  0.001  -  -  -  -  -  -  10
video   SOC   zone:video-thermal    0.001  -  -  -  -  -  -  10
display DISPLAY zone:display-thermal 0.001 -  -  -  -  -  -  10
modem0  MODEM zone:modem0-thermal   0.001  -  -  -  -  -  -  10
modem1  MODEM zone:modem1-thermal   0.001  -  -  -  -  -  -  10
wlan    WIFI  zone:wlan-thermal     0.001  -  -  -  -  -  -  10
# SKIN: stock skin sensor = PM6125 quiet_therm (ADC 0x4e; thermal-engine BATTERY_CHARGING_CTL 38-43 C,
# quiet-therm-step gold 40 / silver 41 / GPU 43). The zone (A9_THERMAL kernel) and the IIO channel are the
# SAME thermistor. No other fallback (review 24): without quiet_therm the skin sensor is simply absent, and
# Android's thermal status/headroom has no skin input. Kernel: gold from 45, silver from 48.
skin    SKIN  adczone:quiet-therm-thermal|iio:quiet_therm  0.001  45 48 50 52 55 58  10
# BATTERY: PMI632 battery thermistor through the observe driver (0.1 C). 30 s: each read is an ADC
# conversion on the charger PMIC. Android's BatteryService also shuts down at 68 C on its own.
battery BATTERY file:/sys/class/power_supply/battery/temp  0.1  42 44 45 50 55 60  30
# PM6125 board thermistors (IIO, A9_THERMAL DT channels; xo_therm is upstream), informational.
# Not yet seen on the phone (no IIO listing in any bundle): absent = unlisted.
xo-therm   SOC   iio:xo_therm          0.001  -  -  -  -  -  -  30
pa-therm0  POWER_AMPLIFIER iio:pa_therm0 0.001 - - -  -  -  -  30
ufs-therm  SOC   iio:emmc_ufs_therm    0.001  -  -  -  -  -  -  30
flash-therm CAMERA iio:camera_flash_therm 0.001 - - - -  -  -  30
